name: Update briefing feed
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_news.py'
      - '.github/workflows/update-news.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Fetch publisher feeds
        run: python scripts/fetch_news.py
      - name: Commit updated stories
        run: |
          if git diff --quiet -- data/news.json; then
            echo 'No feed changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/news.json
            git commit -m 'Update daily news briefing'
            git push
          fi
